[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensitive-upload-guard"
version = "1.0.0"
description = "Lightweight desktop DLP for ChatGPT and Perplexity: native Continue/Cancel dialog for WALLED_SENSITIVE prompts and uploads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["upload_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
