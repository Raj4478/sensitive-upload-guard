<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sensitive Upload Guard</title>
<style>
  body { font: 13px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px 16px; color: #111827; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .status { padding: 8px 10px; border-radius: 8px; background: #f3f4f6; margin-bottom: 12px; }
  .ok { background: #ecfdf5; color: #065f46; }
  .bad { background: #fef2f2; color: #991b1b; }
  label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; gap: 10px; }
  select, input[type=color] { font: inherit; }
  code { font-size: 12px; background: #f3f4f6; padding: 1px 4px; border-radius: 4px; }
  p.note { color: #6b7280; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1><img src="icons/48.png" alt="">Sensitive Upload Guard</h1>
  <div id="status" class="status">Checking the desktop app…</div>
  <label>Colour AI responses <input id="colorEnabled" type="checkbox"></label>
  <label>Response colour <input id="responseColor" type="color"></label>
  <label>If the desktop app is not running
    <select id="failMode">
      <option value="block">Block (safe)</option>
      <option value="allow">Allow</option>
    </select>
  </label>
  <p class="note">Prompts and uploads on ChatGPT and Perplexity are checked for <code>WALLED_SENSITIVE</code>.
    A desktop dialog asks before anything flagged is sent.</p>
  <script src="popup.js"></script>
</body>
</html>
